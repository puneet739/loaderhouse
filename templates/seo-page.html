<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{brand}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:image" content="{{siteUrl}}/assets/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <link rel="icon" href="/assets/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script type="application/ld+json">{{jsonLd}}</script>
  </head>
  <body class="policy-shell">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img src="/assets/logo.png" alt="{{brand}}" height="36" class="me-2" />
          <span class="fw-bold">{{brand}}</span>
        </a>
        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-outline-primary" href="/#contact">
            <i class="bi bi-envelope me-2"></i>Contact
          </a>
        </div>
      </div>
    </nav>

    <header class="policy-hero">
      <div class="container">
        <div class="policy-card p-4 p-lg-5">
          <div class="row g-4 align-items-start">
            <div class="col-lg-8">
              <p class="text-primary text-uppercase fw-semibold mb-2">{{eyebrow}}</p>
              <h1 class="display-6 fw-bold mb-3">{{h1}}</h1>
              <p class="lead text-secondary mb-4">{{intro}}</p>
              <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-primary" href="/#contact">{{primaryCta}}</a>
                <a class="btn btn-outline-primary" href="/">Back to Loaderhouse</a>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="policy-note">
                <strong>{{brand}}:</strong> {{tagline}}
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="policy-body">
      <div class="container">
        <article class="policy-card p-4 p-lg-5">
          {{sectionsHtml}}
          {{faqHtml}}
          <section class="policy-section">
            <h2>Explore related Loaderhouse pages</h2>
            <ul>
              {{relatedLinksHtml}}
            </ul>
          </section>
        </article>
      </div>
    </main>

    <footer class="py-4 border-top bg-white">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div class="d-flex align-items-center gap-2 text-muted">
          <img src="/assets/logo.png" alt="{{brand}}" height="20" />
          <span>{{brand}} - {{tagline}}</span>
        </div>
        <div class="d-flex gap-3">
          <a class="text-muted" href="/">Home</a>
          <a class="text-muted" href="/policy/">Privacy</a>
          <a class="text-muted" href="/terms/">Terms</a>
        </div>
      </div>
    </footer>
  </body>
</html>
